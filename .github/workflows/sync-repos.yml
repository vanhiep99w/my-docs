name: Sync child repositories

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [child-main-updated]

permissions:
  contents: write

concurrency:
  group: sync-child-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Test safe synchronization
        run: python3 -m unittest discover -s tests -v
      - name: Update pointers to child main tips
        run: python3 scripts/sync-repos.py --commit
      - name: Push collection main
        run: git push origin HEAD:main
